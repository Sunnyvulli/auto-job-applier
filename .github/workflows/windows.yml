name: Test and build Windows installers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
      - name: Desktop interaction checks
        run: xvfb-run -a python -m pytest tests/test_desktop.py -q
  windows:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt pyinstaller==6.16.0
      - run: python -m playwright install --no-shell chromium
      - run: python -m pytest tests/test_core.py tests/test_productivity.py tests/test_desktop.py -q
      - name: Freeze app with bundled browser
        run: python -m PyInstaller --noconfirm --clean --windowed --name ApplyPilot --collect-all playwright --collect-all reportlab --hidden-import keyring.backends.Windows --copy-metadata google-auth --copy-metadata google-auth-oauthlib --copy-metadata requests-oauthlib --add-data "browsers;browsers" launcher.py
      - name: Stage Lite edition
        shell: python
        run: |
          import shutil
          shutil.copytree('dist/ApplyPilot','dist/ApplyPilotLite',ignore=shutil.ignore_patterns('browsers'))
      - name: Compile Full and Lite installers
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DVariant=Full packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Full installer compilation failed' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DVariant=Lite packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Lite installer compilation failed' }
      - name: Test installed Full edition
        shell: pwsh
        run: ./packaging/smoke.ps1 -Installer installer-output/ApplyPilot-Full-Setup.exe -Name full
      - name: Test installed Lite edition
        shell: pwsh
        run: ./packaging/smoke.ps1 -Installer installer-output/ApplyPilot-Lite-Setup.exe -Name lite
      - uses: actions/upload-artifact@v4
        with:
          name: ApplyPilot-Windows-${{ matrix.os }}
          path: installer-output/*.exe
  arm:
    needs: windows
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ApplyPilot-Windows-windows-2022
          path: installer-output
      - name: Test Full x64 emulation on Windows 11 ARM
        shell: pwsh
        run: ./packaging/smoke.ps1 -Installer installer-output/ApplyPilot-Full-Setup.exe -Name arm-full
      - name: Test Lite x64 emulation on Windows 11 ARM
        shell: pwsh
        run: ./packaging/smoke.ps1 -Installer installer-output/ApplyPilot-Lite-Setup.exe -Name arm-lite
  release:
    needs: [test, windows, arm]
    if: always() && needs.test.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ApplyPilot-Windows-windows-2022
          path: installer-output
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch_head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$branch_head" != "${{ github.sha }}" ]; then exit 0; fi
          cd installer-output
          sha256sum *.exe > SHA256SUMS.txt
          gh release create "build-${{ github.run_number }}" *.exe SHA256SUMS.txt --target "${{ github.sha }}" --title "ApplyPilot 0.3 preview" --notes "Dashboard, resume import, preference queues, bulk imports and Full/Lite installers. Both editions tested on Windows Server 2022 and 2025. ARM is experimental; check the ARM job result. See README for supported behavior and live-validation limits."
