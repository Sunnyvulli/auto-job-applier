name: Test and build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt pyinstaller==6.16.0
      - run: python -m playwright install chromium
      - run: python -m pytest tests/test_core.py -q
      - name: Freeze app with Python and Chromium
        run: python -m PyInstaller --noconfirm --clean --windowed --name ApplyPilot --collect-all playwright --collect-all reportlab --hidden-import keyring.backends.Windows --copy-metadata google-auth --copy-metadata google-auth-oauthlib --copy-metadata requests-oauthlib --add-data "browsers;browsers" launcher.py
      - name: Compile installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss'
      - name: Smoke test installed app
        shell: pwsh
        run: |
          $installer = Start-Process installer-output\ApplyPilot-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($installer.ExitCode -ne 0) { throw 'Installer failed' }
          $report = "$env:RUNNER_TEMP\applypilot-smoke.json"
          $p = Start-Process "$env:LOCALAPPDATA\Programs\ApplyPilot\ApplyPilot.exe" -ArgumentList '--smoke-test', $report -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id; throw 'Installed smoke test timed out' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Installed smoke test failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw ($result | ConvertTo-Json) }
          Write-Output ($result | ConvertTo-Json)
      - uses: actions/upload-artifact@v4
        with:
          name: ApplyPilot-Windows-installer
          path: installer-output/ApplyPilot-Setup.exe
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "build-${{ github.run_number }}"
          $head = gh api "repos/${{ github.repository }}/commits/main" --jq .sha
          if ($head -ne "${{ github.sha }}") { Write-Output "Skipping superseded build release"; exit 0 }
          gh release create $tag installer-output/ApplyPilot-Setup.exe --target "${{ github.sha }}" --title "ApplyPilot 0.2 preview ($tag)" --notes "Free local preview with four job feeds, account helpers and optional Gmail OAuth. Bundles Python and Chromium. See README for supported features and limitations. Unsigned installer."
